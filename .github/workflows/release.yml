name: Publish NPC release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read
  artifact-metadata: write
  attestations: write
  id-token: write

jobs:
  release:
    uses: AxolotlBucketLabs/DevTools/.github/workflows/release-plugin.yml@v4.1.2 # v4.1.2
    with:
      mode: tag
      prepare-dependencies: true
      virions: .devtools-virions
