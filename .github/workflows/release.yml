name: Publish NPC release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    uses: AxolotlBucketLabs/DevTools/.github/workflows/release-plugin.yml@v4.0.0 # v4.0.0
    with:
      mode: tag
      prepare-dependencies: true
      virions: .devtools-virions
