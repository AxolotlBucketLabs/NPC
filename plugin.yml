name: NPC
main: AxolotlBucketLabs\NPC\Main
src-namespace-prefix: AxolotlBucketLabs\NPC
version: 0.8.0
api: 5.0.0
load: POSTWORLD
softdepend: [BedrockQuery, PureChat, PurePerms, ScoreHud]
author: NhanAZ
authors: [AxolotlBucketLabs]
website: https://github.com/AxolotlBucketLabs/NPC
description: Visual NPC system for Axolotl-PM API 5
commands:
  npc:
    description: Manage NPCs
    usage: "/npc help"
    permission: npc.command
    aliases: [slapper]
  rca:
    description: Execute a configured NPC action as a player
    usage: "/rca <player> <command>"
    permission: npc.rca
permissions:
  npc.command:
    description: Allows using the NPC command
    default: op
  npc.admin:
    description: Allows creating and editing NPCs
    default: op
  npc.rca:
    description: Allows the compatibility rca command
    default: op
